<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pitzer Investment Fund — Holdings Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>
  <header class="topbar">
    <h1>Pitzer Investment Fund</h1>
    <nav class="nav">
      <a class="nav-link" href="#/">Holdings</a>
      <a class="nav-link" href="#/screener">Discovery</a>
      <a class="nav-link" href="#/insiders">Insiders</a>
      <a class="nav-link" href="#/macro">Macro</a>
      <a class="nav-link" href="#/watchlist">Watchlist</a>
    </nav>
    <form id="jumpForm" class="jump-form">
      <input id="jumpInput" type="text" placeholder="Research a ticker..." maxlength="10" />
    </form>
    <div class="auth-area">
      <span id="authStatus" class="auth-status">Viewing only</span>
      <button id="loginBtn" class="btn btn-ghost">Unlock editing</button>
      <button id="logoutBtn" class="btn btn-ghost hidden">Lock</button>
    </div>
  </header>

  <main id="view"></main>

  <dialog id="dialog">
    <form id="posForm">
      <h2 id="dialogTitle">Add position</h2>
      <input type="hidden" name="id" />
      <label>Ticker <input name="symbol" required maxlength="10" style="text-transform:uppercase" /></label>
      <label>Shares <input name="shares" type="number" step="any" required /></label>
      <label>Last Price <input name="lastPrice" type="number" step="any" /></label>
      <label>Avg Cost / Share <input name="avgCost" type="number" step="any" /></label>
      <label>Total Cost ($) <input name="totalCost" type="number" step="any" /></label>
      <label>Market Value ($) <input name="marketValue" type="number" step="any" /></label>
      <label>Dividend Income ($) <input name="divIncome" type="number" step="any" /></label>
      <label>Notes <input name="notes" /></label>
      <div class="dialog-actions">
        <button type="button" id="cancelBtn" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="loginDialog">
    <form id="loginForm">
      <h2>Unlock editing</h2>
      <label>Shared edit password <input name="password" type="password" required /></label>
      <p class="error hidden" id="loginError">Incorrect password.</p>
      <div class="dialog-actions">
        <button type="button" id="loginCancelBtn" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary">Unlock</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
