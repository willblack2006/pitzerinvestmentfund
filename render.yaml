services:
  - type: web
    name: pitzer-investment-fund
    env: node
    plan: starter # free instances can't attach a disk, and the database lives on the disk
    region: oregon
    healthCheckPath: /api/positions
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: EDIT_PASSWORD
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: AUTO_REFRESH_PRICES
        value: "false"
      - key: DB_PATH
        value: /data/pif.db
    disk:
      name: pif-data
      mountPath: /data
      sizeGB: 1
